openapi: 3.0.3
info:
  title: Spire Scrims REST API
  version: 1.0.0
  description: |
    HTTP API for external tools to manage scrims, lobbies, lobby players, lobby scores, and point systems.

    ## Authentication
    Every request needs a bearer token: `Authorization: Bearer <api-key>`.
    The API owner will provide your key. Missing or invalid key → `401`.
    API temporarily unavailable → `503`.

    ## Conventions
    - Request/response bodies are JSON.
    - IDs (`seasonId`, `scrimId`, `lobbyId`, `playerId`, ...) are opaque strings
      returned by the lookup endpoints — fetch them from there, don't construct them.
    - Errors return `{"error": "message"}` with status `400` (bad input / business
      rule), `404` (not found), or `401`/`503` (auth).

    ## Typical flow (see scripts/test_create_scrim.py)
    1. `GET /api/seasons` — pick a season
    2. `GET /api/point-systems`, `GET /api/map-lineups` — optional attachments
    3. `POST /api/scrims` — create the scrim
    4. `POST /api/lobbies` — one per lobby
    5. `GET /api/players?search=...` — resolve player names to IDs (or skip
       this step and use Discord IDs directly in the next one)
    6. `POST /api/lobbies/{lobbyId}/players` — fill each lobby, referencing
       players by `playerIds` and/or `discordIds`

    ## Scoring a lobby
    1. `GET /api/lobbies/{lobbyId}/map-lineup` — get each map's `id` and
       `mapIndex` for the lobby's scrim
    2. `GET /api/lobbies/{lobbyId}/point-system` — the scoring field names
       and values to use as `score` keys
    3. `GET /api/lobbies/{lobbyId}/players` — the players you can score
    4. `PUT /api/lobbies/{lobbyId}/scores` — submit scores for one map
       (`mapId` + `mapIndex`); repeat per map
    5. `GET /api/lobbies/{lobbyId}/scores` — read back stored scores,
       placement points and map winners
servers:
  - url: /
    description: Production API through the docs server

security:
  - bearerAuth: []

tags:
  - name: Lookups
    description: >
      Read-only endpoints to resolve names to IDs (seasons, players, point
      systems, map lineups) and to inspect existing scrims and lobbies.
  - name: Players
    description: Create players.
  - name: Scrims
    description: Create and delete scrims.
  - name: Lobbies
    description: Create and delete lobbies, and manage each lobby's roster.
  - name: Scores
    description: Read and submit per-map player scores for a lobby.

paths:
  /api/seasons:
    get:
      tags: [Lookups]
      summary: List seasons
      description: Returns all non-deleted seasons, newest first. Use the first entry as the "latest" season.
      operationId: listSeasons
      responses:
        "200":
          description: Seasons list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/players:
    get:
      tags: [Lookups]
      summary: List / search players
      description: Optionally filter with `search` (case-insensitive substring match on the player name).
      operationId: listPlayers
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          example: glitch
          description: Case-insensitive substring to match against player names.
      responses:
        "200":
          description: Matching players
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayersResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    post:
      tags: [Players]
      summary: Create a player
      description: >
        Creates a player, optionally linked to a Discord user ID. The name must
        be unique, and so must the Discord ID when given.
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlayerRequest" }
            example:
              name: 1stGlitch
              discordId: "123456789012345678"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePlayerResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/point-systems:
    get:
      tags: [Lookups]
      summary: List point systems
      description: >
        Point systems, with their scoring rules, that can be attached to a
        scrim at creation via `pointSystemId`.
      operationId: listPointSystems
      responses:
        "200":
          description: Point systems list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointSystemsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/map-lineups:
    get:
      tags: [Lookups]
      summary: List map lineups
      description: Map lineups that can be attached to a scrim at creation via `mapLineupId`.
      operationId: listMapLineups
      responses:
        "200":
          description: Map lineups list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapLineupsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/scrims:
    get:
      tags: [Lookups]
      summary: List scrims
      description: Newest first. Includes private scrims.
      operationId: listScrims
      parameters:
        - name: seasonId
          in: query
          required: false
          schema: { type: string }
          description: Filter by season.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
          description: Max results; caps at 200.
      responses:
        "200":
          description: Scrims list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrimsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    post:
      tags: [Scrims]
      summary: Create a scrim
      description: >
        Creates a scrim in the given season. Attach a point system and/or map
        lineup by ID (resolve them with the lookup endpoints first).
      operationId: createScrim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScrimRequest" }
            example:
              name: Weekly Ranked
              type: Solos
              seasonId: k57...
              isPrivate: false
              pointSystemId: m12...
              mapLineupId: n34...
      responses:
        "201":
          description: Scrim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateScrimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/scrims/{scrimId}:
    get:
      tags: [Lookups]
      summary: Get a scrim
      operationId: getScrim
      parameters:
        - $ref: "#/components/parameters/scrimId"
      responses:
        "200":
          description: The scrim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    delete:
      tags: [Scrims]
      summary: Delete a scrim
      description: >
        Deletes the scrim and everything under it (lobbies, lobby scores,
        scrim players). Irreversible.
      operationId: deleteScrim
      parameters:
        - $ref: "#/components/parameters/scrimId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/scrims/{scrimId}/lobbies:
    get:
      tags: [Lookups]
      summary: List a scrim's lobbies
      description: Each lobby includes its number and current roster.
      operationId: listScrimLobbies
      parameters:
        - $ref: "#/components/parameters/scrimId"
      responses:
        "200":
          description: Lobbies with rosters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrimLobbiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies:
    post:
      tags: [Lobbies]
      summary: Create a lobby
      description: >
        Adds an empty lobby to a scrim. Lobby numbers auto-increment within
        the scrim.
      operationId: createLobby
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLobbyRequest" }
            example: { scrimId: "p88..." }
      responses:
        "201":
          description: Lobby created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateLobbyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies/{lobbyId}:
    delete:
      tags: [Lobbies]
      summary: Delete a lobby
      description: >
        Deletes the lobby and its scores; remaining lobbies in the scrim are
        renumbered.
      operationId: deleteLobby
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies/{lobbyId}/players:
    get:
      tags: [Lobbies]
      summary: List a lobby's players
      description: Players currently in the lobby, in roster order.
      operationId: getLobbyPlayers
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      responses:
        "200":
          description: The lobby's players
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LobbyPlayersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    post:
      tags: [Lobbies]
      summary: Add players to a lobby
      description: >
        Appends to the current roster; duplicates are ignored. Max 12 players
        per lobby. Returns the full roster after the change.
      operationId: addLobbyPlayers
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      requestBody: { $ref: "#/components/requestBodies/PlayerIds" }
      responses:
        "200": { $ref: "#/components/responses/Roster" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    put:
      tags: [Lobbies]
      summary: Replace a lobby's players
      description: >
        Replaces the entire roster with the given players. Players removed
        this way also lose any scores recorded in that lobby.
      operationId: replaceLobbyPlayers
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      requestBody: { $ref: "#/components/requestBodies/PlayerIds" }
      responses:
        "200": { $ref: "#/components/responses/Roster" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies/{lobbyId}/map-lineup:
    get:
      tags: [Scores]
      summary: Get a lobby's map lineup
      description: >
        The map lineup attached to the lobby's scrim, with each map's
        `mapIndex`. Use `id` + `mapIndex` when submitting or filtering scores.
        `mapLineup` is `null` when the scrim has no lineup attached.
      operationId: getLobbyMapLineup
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      responses:
        "200":
          description: The lobby's map lineup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LobbyMapLineupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies/{lobbyId}/point-system:
    get:
      tags: [Scores]
      summary: Get a lobby's point system
      description: >
        The point system attached to the lobby's scrim. Its `fields` names are
        the keys to use in `score` when submitting scores. `pointSystem` is
        `null` when the scrim has no point system attached.
      operationId: getLobbyPointSystem
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      responses:
        "200":
          description: The lobby's point system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LobbyPointSystemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

  /api/lobbies/{lobbyId}/scores:
    get:
      tags: [Scores]
      summary: Get a lobby's scores
      description: >
        Stored player scores for the lobby, sorted by `mapIndex`. Pass both
        `mapId` and `mapIndex` to get a single map; passing only one of them
        returns `400`.
      operationId: getLobbyScores
      parameters:
        - $ref: "#/components/parameters/lobbyId"
        - name: mapId
          in: query
          required: false
          schema: { type: string }
          description: Map ID from `GET /api/lobbies/{lobbyId}/map-lineup`. Requires `mapIndex`.
          example: "r11map"
        - name: mapIndex
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: 0-based position of the map in the lineup. Requires `mapId`.
          example: 0
      responses:
        "200":
          description: The lobby's scores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LobbyScoresResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }
    put:
      tags: [Scores]
      summary: Submit scores for one map
      description: >
        Upserts scores for one map (`mapId` + `mapIndex`) of the lobby. Only
        the players you send are changed; other players' stored scores for
        that map are kept. A player's `score` object is replaced as a whole,
        not merged field by field.


        After saving, placement points, EPP bonuses and the map winner are
        recalculated for the whole map using the scrim's point system. Every
        player must already be in the lobby; any invalid entry fails the whole
        request with `400` and nothing is saved. Returns all scores for that
        map after the update.
      operationId: updateLobbyScores
      parameters:
        - $ref: "#/components/parameters/lobbyId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLobbyScoresRequest" }
            example:
              mapId: "r11map"
              mapIndex: 0
              playerScores:
                - playerId: "j97player"
                  score: { Win: 7, Elims: 6 }
                  agent: Ghost
                - discordId: "123456789012345678"
                  score: { Elims: 2 }
      responses:
        "200":
          description: All scores for the map after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LobbyScoresResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/KeyNotConfigured" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Enter the API key provided to you. Swagger adds the `Bearer` prefix.

  parameters:
    scrimId:
      name: scrimId
      in: path
      required: true
      schema: { type: string }
      description: Opaque scrim ID from `POST /api/scrims` or `GET /api/scrims`.
    lobbyId:
      name: lobbyId
      in: path
      required: true
      schema: { type: string }
      description: Opaque lobby ID from `POST /api/lobbies` or `GET /api/scrims/{scrimId}/lobbies`.

  requestBodies:
    PlayerIds:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateLobbyRosterRequest" }

  responses:
    Roster:
      description: The lobby's full roster after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LobbyRosterResponse" }
    BadRequest:
      description: Bad input, invalid ID, missing resource, or business rule violation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or wrong API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    KeyNotConfigured:
      description: API authentication is not configured on the deployment
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ResourceId:
      type: string
      minLength: 1
      description: Opaque ID returned by the API. Do not build IDs manually.
      example: "k17abc123"

    Timestamp:
      type: number
      format: double
      description: Unix timestamp in milliseconds.
      example: 1787068800000

    GameType:
      type: string
      enum: [Solos, Duos, Trios]
      description: Roster format used by the scrim.
      example: Solos

    NamedResource:
      type: object
      additionalProperties: false
      required: [id, name]
      description: A resource reduced to the fields needed for selection and display.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name:
          type: string
          minLength: 1
          description: Display name.
          example: Season 5

    Player:
      type: object
      additionalProperties: false
      required: [id, name, discordId]
      description: A player with their linked Discord ID, if any.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name:
          type: string
          minLength: 1
          description: Display name.
          example: 1stGlitch
        discordId:
          type: string
          nullable: true
          description: >
            Linked Discord user ID (snowflake), or `null` when the player has
            no Discord ID on record. Usable in `discordIds` when updating a
            lobby roster.
          example: "123456789012345678"

    Scrim:
      type: object
      additionalProperties: false
      required:
        [id, name, type, isPrivate, seasonId, pointSystemId, mapLineupId, createdAt]
      description: A scrim and its selected configuration.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name:
          type: string
          minLength: 1
          example: Weekly Ranked
        type: { $ref: "#/components/schemas/GameType" }
        isPrivate:
          type: boolean
          description: Whether the scrim is hidden from public views.
          example: false
        seasonId:
          type: string
          nullable: true
          description: Season containing the scrim.
          example: "k57season"
        pointSystemId:
          type: string
          nullable: true
          description: Attached point system, or `null` when none is selected.
          example: "m12points"
        mapLineupId:
          type: string
          nullable: true
          description: Attached map lineup, or `null` when none is selected.
          example: "n34lineup"
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    LobbyDetails:
      type: object
      additionalProperties: false
      required: [id, number, players, createdAt]
      description: A lobby returned when listing a scrim's lobbies.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        number:
          type: integer
          minimum: 1
          description: 1-based position within the scrim.
          example: 1
        players:
          type: array
          maxItems: 12
          description: Players currently assigned to the lobby.
          items: { $ref: "#/components/schemas/Player" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
      example:
        id: "q42lobby"
        number: 1
        players:
          - { id: "j97player", name: "1stGlitch", discordId: "123456789012345678" }
          - { id: "j98player", name: "A penguin", discordId: null }
        createdAt: 1787068800000

    CreatedLobby:
      type: object
      additionalProperties: false
      required: [id, number, players]
      description: A newly created empty lobby.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        number:
          type: integer
          minimum: 1
          description: 1-based position within the scrim.
          example: 1
        players:
          type: array
          maxItems: 12
          description: Player IDs assigned to the lobby. New lobbies start empty.
          items: { $ref: "#/components/schemas/ResourceId" }
      example: { id: "q42lobby", number: 1, players: [] }

    CreateScrimRequest:
      type: object
      additionalProperties: false
      required: [name, type, seasonId]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name for the scrim.
          example: Weekly Ranked
        type: { $ref: "#/components/schemas/GameType" }
        seasonId:
          type: string
          minLength: 1
          description: ID from `GET /api/seasons`.
          example: "k57season"
        isPrivate:
          type: boolean
          default: false
          description: Hide the scrim from public views.
        pointSystemId:
          type: string
          minLength: 1
          description: Optional ID from `GET /api/point-systems`.
          example: "m12points"
        mapLineupId:
          type: string
          minLength: 1
          description: Optional ID from `GET /api/map-lineups`.
          example: "n34lineup"

    CreatePlayerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name. Must not match an existing player's name.
          example: 1stGlitch
        discordId:
          type: string
          minLength: 1
          description: >
            Optional Discord user ID (snowflake) to link. Must not already be
            linked to another player.
          example: "123456789012345678"

    CreatePlayerResponse:
      type: object
      additionalProperties: false
      required: [player]
      properties:
        player: { $ref: "#/components/schemas/Player" }
      example:
        player: { id: "j97player", name: "1stGlitch", discordId: "123456789012345678" }

    CreateLobbyRequest:
      type: object
      additionalProperties: false
      required: [scrimId]
      properties:
        scrimId:
          type: string
          minLength: 1
          description: ID of the scrim that will own the lobby.
          example: "p88scrim"

    UpdateLobbyRosterRequest:
      type: object
      additionalProperties: false
      description: >
        Reference players by internal ID and/or Discord ID. At least one of
        `playerIds` or `discordIds` must be present; when both are given the
        lists are combined. Unknown IDs of either kind fail the whole request
        with `400`.
      anyOf:
        - required: [playerIds]
        - required: [discordIds]
      properties:
        playerIds:
          type: array
          maxItems: 12
          description: Player IDs from `GET /api/players`.
          items: { $ref: "#/components/schemas/ResourceId" }
          example: ["j97player", "j98player"]
        discordIds:
          type: array
          maxItems: 12
          description: >
            Discord user IDs (snowflakes) of players. Only works for players
            that have a Discord ID linked — check `discordId` on
            `GET /api/players`.
          items: { type: string, minLength: 1 }
          example: ["123456789012345678"]

    SeasonsResponse:
      type: object
      additionalProperties: false
      required: [seasons]
      properties:
        seasons:
          type: array
          description: Non-deleted seasons, newest first.
          items: { $ref: "#/components/schemas/NamedResource" }
      example:
        seasons: [{ id: "k57season", name: "Season 5" }]

    PlayersResponse:
      type: object
      additionalProperties: false
      required: [players]
      properties:
        players:
          type: array
          description: Players matching the optional search text.
          items: { $ref: "#/components/schemas/Player" }
      example:
        players:
          - { id: "j97player", name: "1stGlitch", discordId: "123456789012345678" }

    PointSystemRules:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          description: Scoring fields. Their names are the keys of `score` in lobby scores.
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name:
                type: string
                example: Elims
              value:
                type: number
                description: Points per unit (or per check, for `checkbox` fields).
                example: 2
              type:
                type: string
                enum: [number, checkbox]
        placementPoints:
          type: object
          additionalProperties: false
          required: [enabled, points]
          properties:
            enabled: { type: boolean }
            points:
              type: array
              description: Points by placement, first place first.
              items: { type: number }
              example: [3, 2, 1]
            minMatchPoints: { type: number }
        bonusPoints:
          type: object
          additionalProperties: false
          required: [enabled, bonuses]
          properties:
            enabled: { type: boolean }
            bonuses:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, fields, value]
                properties:
                  name: { type: string }
                  fields:
                    type: array
                    items: { type: string }
                  value: { type: number }
        exquisitePerformancePoints:
          type: object
          additionalProperties: false
          required:
            [enabled, missionPointFields, extractionFields, pointDifferenceThreshold, bonusValue]
          description: EPP bonus settings.
          properties:
            enabled: { type: boolean }
            missionPointFields:
              type: array
              items: { type: string }
            extractionFields:
              type: array
              items: { type: string }
            pointDifferenceThreshold: { type: number }
            bonusValue: { type: number }

    PointSystem:
      type: object
      additionalProperties: false
      required: [id, name, pointSystem]
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name:
          type: string
          example: Points 4.0 (Newest)
        pointSystem: { $ref: "#/components/schemas/PointSystemRules" }

    PointSystemsResponse:
      type: object
      additionalProperties: false
      required: [pointSystems]
      properties:
        pointSystems:
          type: array
          items: { $ref: "#/components/schemas/PointSystem" }
      example:
        pointSystems:
          - id: "m12points"
            name: Points 4.0 (Newest)
            pointSystem:
              fields:
                - { name: Win, value: 7, type: checkbox }
                - { name: Elims, value: 2, type: number }
              placementPoints: { enabled: true, points: [3, 2, 1] }

    LobbyPointSystemResponse:
      type: object
      additionalProperties: false
      required: [pointSystem]
      properties:
        pointSystem:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name, pointSystem]
          description: The scrim's point system, or `null` when none is attached.
          properties:
            id: { $ref: "#/components/schemas/ResourceId" }
            name:
              type: string
              example: Points 4.0 (Newest)
            pointSystem: { $ref: "#/components/schemas/PointSystemRules" }
      example:
        pointSystem:
          id: "m12points"
          name: Points 4.0 (Newest)
          pointSystem:
            fields:
              - { name: Win, value: 7, type: checkbox }
              - { name: Elims, value: 2, type: number }
            placementPoints: { enabled: true, points: [3, 2, 1] }

    MapLineupsResponse:
      type: object
      additionalProperties: false
      required: [mapLineups]
      properties:
        mapLineups:
          type: array
          items: { $ref: "#/components/schemas/NamedResource" }
      example:
        mapLineups:
          - { id: "n34lineup", name: "FSD > SE > HSD > SR > DS > FSN" }

    ScrimsResponse:
      type: object
      additionalProperties: false
      required: [scrims]
      properties:
        scrims:
          type: array
          description: Scrims ordered from newest to oldest.
          items: { $ref: "#/components/schemas/Scrim" }
      example:
        scrims:
          - id: "p88scrim"
            name: Weekly Ranked
            type: Solos
            isPrivate: false
            seasonId: "k57season"
            pointSystemId: "m12points"
            mapLineupId: "n34lineup"
            createdAt: 1787068800000

    ScrimResponse:
      type: object
      additionalProperties: false
      required: [scrim]
      properties:
        scrim: { $ref: "#/components/schemas/Scrim" }

    ScrimLobbiesResponse:
      type: object
      additionalProperties: false
      required: [lobbies]
      properties:
        lobbies:
          type: array
          description: Lobbies ordered by their number.
          items: { $ref: "#/components/schemas/LobbyDetails" }

    CreateScrimResponse:
      type: object
      additionalProperties: false
      required: [scrimId]
      properties:
        scrimId:
          type: string
          description: ID of the newly created scrim.
          example: "p88scrim"

    CreateLobbyResponse:
      type: object
      additionalProperties: false
      required: [lobby]
      properties:
        lobby: { $ref: "#/components/schemas/CreatedLobby" }

    LobbyRosterResponse:
      type: object
      additionalProperties: false
      required: [players]
      properties:
        players:
          type: array
          maxItems: 12
          description: Full list of player IDs in the lobby after the change.
          items: { $ref: "#/components/schemas/ResourceId" }
          example: ["j97player", "j98player"]

    LobbyPlayersResponse:
      type: object
      additionalProperties: false
      required: [players]
      properties:
        players:
          type: array
          maxItems: 12
          description: Players in the lobby, in roster order.
          items: { $ref: "#/components/schemas/Player" }
      example:
        players:
          - { id: "j97player", name: "1stGlitch", discordId: "123456789012345678" }
          - { id: "j98player", name: "A penguin", discordId: null }

    LineupMap:
      type: object
      additionalProperties: false
      required: [id, name, mapIndex]
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name:
          type: string
          example: Fragrant Shore (Day)
        mapIndex:
          type: integer
          minimum: 0
          description: >
            0-based position in the lineup. The same map can appear more than
            once, so scores are keyed by `mapId` + `mapIndex`.
          example: 0

    LobbyMapLineupResponse:
      type: object
      additionalProperties: false
      required: [mapLineup]
      properties:
        mapLineup:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name, maps]
          description: The scrim's map lineup, or `null` when none is attached.
          properties:
            id: { $ref: "#/components/schemas/ResourceId" }
            name:
              type: string
              example: FSD > SE > HSD > SR > DS > FSN
            maps:
              type: array
              items: { $ref: "#/components/schemas/LineupMap" }
      example:
        mapLineup:
          id: "n34lineup"
          name: FSD > SE > HSD
          maps:
            - { id: "r11map", name: Fragrant Shore (Day), mapIndex: 0 }
            - { id: "r12map", name: Sound Eclipse, mapIndex: 1 }
            - { id: "r13map", name: Hard Sell (Day), mapIndex: 2 }

    ScoreFields:
      type: object
      description: >
        Points per scoring field, keyed by the field names of the scrim's
        point system (e.g. `Win`, `Elims`), matched exactly including case
        and spaces. Values are points, not counts: 3 elims worth 2 points
        each is `6`. The sum of all values is the player's map score used
        for placement. Unknown keys are stored and still count toward the
        sum.
      additionalProperties: { type: number }
      example: { Win: 7, Elims: 6 }

    UpdateLobbyScoresRequest:
      type: object
      additionalProperties: false
      required: [mapId, mapIndex, playerScores]
      properties:
        mapId:
          type: string
          minLength: 1
          description: Map ID from `GET /api/lobbies/{lobbyId}/map-lineup`.
          example: "r11map"
        mapIndex:
          type: integer
          minimum: 0
          description: 0-based position of the map in the lineup.
          example: 0
        playerScores:
          type: array
          description: >
            One entry per player to update. Each player may appear only once.
            An empty array just recalculates the map.
          items:
            type: object
            additionalProperties: false
            description: Provide exactly one of `playerId` or `discordId`.
            oneOf:
              - required: [playerId]
              - required: [discordId]
            required: [score]
            properties:
              playerId:
                type: string
                minLength: 1
                description: Player ID from `GET /api/lobbies/{lobbyId}/players`.
                example: "j97player"
              discordId:
                type: string
                minLength: 1
                description: Linked Discord user ID of the player.
                example: "123456789012345678"
              score: { $ref: "#/components/schemas/ScoreFields" }
              agent:
                type: string
                description: Optional agent the player used on this map.
                example: Ghost

    LobbyScore:
      type: object
      additionalProperties: false
      required:
        - id
        - mapId
        - mapIndex
        - playerId
        - playerName
        - discordId
        - score
        - calculatedPlacementPoints
        - isMapWinner
        - agent
        - updatedAt
      description: One player's stored score for one map.
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        mapId: { $ref: "#/components/schemas/ResourceId" }
        mapIndex:
          type: integer
          minimum: 0
          example: 0
        playerId: { $ref: "#/components/schemas/ResourceId" }
        playerName:
          type: string
          nullable: true
          description: "`null` if the player no longer exists."
          example: 1stGlitch
        discordId:
          type: string
          nullable: true
          example: "123456789012345678"
        score: { $ref: "#/components/schemas/ScoreFields" }
        calculatedPlacementPoints:
          type: number
          description: >
            Placement points from the point system plus any EPP bonus. `0`
            when the point system has no placement points.
          example: 3
        isMapWinner:
          type: boolean
          example: true
        agent:
          type: string
          nullable: true
          example: Ghost
        updatedAt: { $ref: "#/components/schemas/Timestamp" }

    LobbyScoresResponse:
      type: object
      additionalProperties: false
      required: [scores]
      properties:
        scores:
          type: array
          description: Scores sorted by `mapIndex`.
          items: { $ref: "#/components/schemas/LobbyScore" }
      example:
        scores:
          - id: "s01score"
            mapId: "r11map"
            mapIndex: 0
            playerId: "j97player"
            playerName: 1stGlitch
            discordId: "123456789012345678"
            score: { Win: 7, Elims: 6 }
            calculatedPlacementPoints: 3
            isMapWinner: true
            agent: Ghost
            updatedAt: 1787068800000

    Deleted:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: Confirms that the operation completed.
          example: true

    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable explanation of the failure.
          example: Scrim not found
